<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Personal Assistant | RelayOps</title>
    <meta
      name="description"
      content="Executive AI assistant powered by RelayOps. Manage Gmail, Google Calendar, tasks, Google Drive, and live online research from one installable smartphone PWA."
    />
    <meta property="og:title" content="Personal Assistant | RelayOps" />
    <meta
      property="og:description"
      content="Executive AI assistant powered by RelayOps. Manage Gmail, Google Calendar, tasks, Google Drive, and live online research from one installable smartphone PWA."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="application-name" content="RelayOps" />
    <meta name="theme-color" content="#181818" />
    <meta name="msapplication-TileColor" content="#fd6500" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RelayOps" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Capture early Android/Chromium install prompt before React mounts
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
      });
      // Apply saved theme immediately to avoid flash on standalone launch
      try {
        var savedTheme = localStorage.getItem('ro_chat_theme_v1');
        var isLight = savedTheme === 'light';
        document.documentElement.dataset.theme = isLight ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', !isLight);
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute('content', isLight ? '#ffffff' : '#181818');
      } catch (_) {}
    </script>
  </head>
  <body class="h-[var(--app-height,100dvh)] w-full overflow-hidden antialiased">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
